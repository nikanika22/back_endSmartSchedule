$kind: http-request
name: Create Semester
method: POST
url: '{{base_url}}/semesters'
auth:
  type: bearer
  credentials:
    token: '{{access_token}}'
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "semester_id": "HK1-2024",
      "name": "Học kỳ 1 năm 2024",
      "start_date": "2024-09-01",
      "end_date": "2025-01-15"
    }
description: 'Create a new academic semester.'
order: 1000
